name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARD-Assistant-Setup
          path: dist/*.exe
      - name: Attach installer to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe --title "ARD Assistant $GITHUB_REF_NAME" --notes "Download the .exe below and double-click it to install." || gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
