name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARD-Assistant-Setup
          path: dist/*.exe
      - name: Attach installer to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release create "$TAG" dist/*.exe --target "$GITHUB_SHA" --title "ARD Assistant $TAG" --notes "Download the .exe below and double-click it to install." || gh release upload "$TAG" dist/*.exe --clobber
